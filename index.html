  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

{ a.fg }};padding:10px 0;border-radius:14px;font-family:'Fredoka';font-weight:600;font-size:12.5px\">{{ a.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px\">\n            <div style=\"font-family:'Nunito';font-weight:700;font-size:12px;color:#B78A93;margin-bottom:7px\">INTENSIDADE DO DÉFICE<\u002Fdiv>\n            <div style=\"display:flex;gap:7px\">\n              <sc-for list=\"{{ deficitOpts }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ d.pick }}\" style=\"flex:1;cursor:pointer;border:1.5px solid {{ d.border }};background:{{ d.bg }};color:{{ d.fg }};padding:10px 4px;border-radius:14px;font-family:'Fredoka';font-weight:600;font-size:12px\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= NÓS ================= -->\n      <sc-if value=\"{{ isNos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"padding:4px 4px 12px\">\n          <div style=\"font-family:'Fredoka';font-weight:700;font-size:24px;color:#4A3A3F\">Nós 💌<\u002Fdiv>\n          <div style=\"font-family:'Nunito';font-weight:600;font-size:13.5px;color:#B78A93\">Daddy 💜 &amp; Daddys Girl ❤️<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- partner card -->\n        <div style=\"background:linear-gradient(135deg,{{ partnerColor }},{{ partnerColorSoft }});border-radius:28px;padding:18px;box-shadow:0 18px 34px -18px {{ partnerColor }};color:#fff\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n            <div style=\"width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px\">{{ partnerEmoji }}<\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Nunito';font-weight:700;font-size:11.5px;opacity:.85;letter-spacing:.3px\">O TEU AMOR<\u002Fdiv>\n              <div style=\"font-family:'Fredoka';font-weight:700;font-size:20px;line-height:1\">{{ partnerName }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px\">\n            <div style=\"flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:11px 8px;text-align:center\">\n              <div style=\"font-family:'Fredoka';font-weight:700;font-size:18px\">{{ partner.weight }}<\u002Fdiv>\n              <div style=\"font-family:'Nunito';font-weight:700;font-size:10.5px;opacity:.85\">kg · {{ partner.wDelta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:11px 8px;text-align:center\">\n              <div style=\"font-family:'Fredoka';font-weight:700;font-size:18px\">{{ partner.goalsPct }}%<\u002Fdiv>\n              <div style=\"font-family:'Nunito';font-weight:700;font-size:10.5px;opacity:.85\">objetivos<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:11px 8px;text-align:center\">\n              <div style=\"font-family:'Fredoka';font-weight:700;font-size:18px\">{{ partner.stat }}<\u002Fdiv>\n              <div style=\"font-family:'Nunito';font-weight:700;font-size:10.5px;opacity:.85\">{{ partner.statLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;background:rgba(255,255,255,.14);border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:9px\">\n            <span style=\"font-size:16px\">🏋️<\u002Fspan>\n            <span style=\"font-family:'Nunito';font-weight:700;font-size:13px\">Hoje: {{ partner.workout }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- messages thread -->\n        <div style=\"margin:20px 4px 12px;font-family:'Fredoka';font-weight:600;font-size:16px;color:#4A3A3F\">Recadinhos 💬<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-if value=\"{{ threadEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:24px 16px;font-family:'Nunito';font-weight:600;font-size:13.5px;color:#9A8A8E;line-height:1.45\">💌 Ainda sem recadinhos.<br>Escreve o primeiro aqui em baixo!<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ thread }}\" as=\"m\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;justify-content:{{ m.align }}\">\n              <div style=\"max-width:82%;background:{{ m.bubble }};color:{{ m.fg }};border-radius:{{ m.radius }};padding:12px 15px;box-shadow:0 6px 16px -10px rgba(180,80,110,.4)\">\n                <div style=\"font-family:'Nunito';font-weight:700;font-size:10.5px;color:{{ m.nameColor }};margin-bottom:3px\">{{ m.name }} · {{ m.date }}<\u002Fdiv>\n                <div style=\"font-family:'Nunito';font-weight:600;font-size:14.5px;line-height:1.4\">{{ m.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- compose -->\n        <div style=\"margin-top:16px;background:#fff;border-radius:24px;padding:10px 10px 10px 16px;border:1px solid #FBE9EC;box-shadow:0 10px 24px -18px rgba(180,80,110,.3);display:flex;align-items:center;gap:8px\">\n          <input ref=\"{{ msgRef }}\" placeholder=\"{{ composePlaceholder }}\" sc-camel-on-key-down=\"{{ onMsgKey }}\" style=\"flex:1;border:none;outline:none;font-family:'Nunito';font-weight:600;font-size:14.5px;color:#4A3A3F;background:transparent\">\n          <button sc-camel-on-click=\"{{ sendMsg }}\" style=\"border:none;cursor:pointer;width:44px;height:44px;border-radius:16px;background:{{ meColor }};color:#fff;font-size:19px;flex:none\">➤<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- BOTTOM TABS -->\n    <div style=\"position:sticky;bottom:0;z-index:40;padding:8px 14px 14px;background:linear-gradient(0deg,{{ bg }} 62%,transparent)\">\n      <div style=\"background:#fff;border-radius:26px;padding:8px 6px;box-shadow:0 12px 30px -12px rgba(180,80,110,.4);border:1px solid #FBE9EC;display:flex;justify-content:space-around\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0\">\n            <div style=\"width:44px;height:32px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;background:{{ t.bg }};transition:.2s\">{{ t.icon }}<\u002Fdiv>\n            <span style=\"font-family:'Fredoka';font-weight:600;font-size:10.5px;color:{{ t.color }}\">{{ t.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- toast -->\n    <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;animation:toastin .25s;background:#4A3A3F;color:#fff;padding:12px 20px;border-radius:18px;font-family:'Fredoka';font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);white-space:nowrap;max-width:88%\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:448,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.msgRef = React.createRef();\n    this.addExRef = React.createRef();\n    const t = this.todayStr();\n    const saved = this.load();\n    this.state = Object.assign({\n      tab:'inicio', who:'girl', now:Date.now(), toast:'',\n      selIdx:null, weightDraft:null, editMode:false,\n      pill:{ takenDate:null, streak:0 },\n      exDone:{},\n      goals:{ daddy:{water:0, cal:0, sleep:0, workout:false},\n              girl:{water:0, cal:0, sleep:0, workout:false} },\n      plan:{ daddy:{current:80, goal:75, height:180, age:28, sex:'m', activity:1.55, deficit:500},\n             girl:{current:60, goal:55, height:165, age:26, sex:'f', activity:1.375, deficit:400} },\n      weights:{ daddy:[], girl:[] },\n      workouts:{ daddy:this.defaultWorkouts(), girl:this.defaultWorkouts() },\n      messages:[],\n      notif:{ enabled:false }, fired:{}, loggedIn:false,\n    }, saved || {});\n    this.state.now = Date.now();\n  }\n  componentDidMount(){ this.timer = setInterval(()=>{ this.setState({now:Date.now()}); this.checkReminders(); },1000); }\n\n  notify(title,body){ try{ if(typeof Notification!=='undefined'&&Notification.permission==='granted') new Notification(title,{body,icon:'',tag:title}); }catch(e){} }\n  checkReminders(){\n    const s=this.state; if(!s.notif.enabled) return;\n    const now=new Date(); const t=this.todayStr(); const y=now.getFullYear(),mo=now.getMonth(),da=now.getDate();\n    const nowMs=now.getTime();\n    const pre=new Date(y,mo,da,20,45,0).getTime(), due=new Date(y,mo,da,21,0,0).getTime();\n    const taken=s.pill.takenDate===t;\n    const fire=(key,title,body)=>{ if(s.fired[key])return; this.up(st=>({fired:{...st.fired,[key]:true}})); this.notify(title,body); this.toastMsg(body); };\n    if(!taken && nowMs>=pre && nowMs<due) fire('pre-'+t,'💊 NosFit','Faltam 15 min para a pílula da Daddys Girl!');\n    if(!taken && nowMs>=due && nowMs<due+3600000) fire('due-'+t,'💊 NosFit','Está na hora da pílula! São 21:00 🚨');\n    if(s.workouts[s.who][now.getDay()].exs===null && now.getHours()>=9) fire('rest-'+s.who+'-'+t,'😴 NosFit','Hoje é dia de descanso — recupera e hidrata-te 💜');\n  }\n  enableReminders(){\n    const on=this.state.notif.enabled;\n    if(on){ this.up(s=>({notif:{enabled:false}})); this.toastMsg('Lembretes desligados'); return; }\n    if(typeof Notification==='undefined'){ this.up(s=>({notif:{enabled:true}})); this.toastMsg('🔔 Lembretes ativos (in-app)'); return; }\n    if(Notification.permission==='granted'){ this.up(s=>({notif:{enabled:true}})); this.toastMsg('🔔 Lembretes ativos'); return; }\n    Notification.requestPermission().then(p=>{ this.up(s=>({notif:{enabled:true}})); this.toastMsg(p==='granted'?'🔔 Lembretes ativos':'Ativos (aviso dentro da app)'); });\n  }\n  componentWillUnmount(){ clearInterval(this.timer); if(this.tt) clearTimeout(this.tt); }\n\n  // ---- persistence ----\n  load(){ try{ return JSON.parse(localStorage.getItem('nosfit_v2'))||null; }catch(e){ return null; } }\n  save(){ try{ const {tab,who,now,toast,selIdx,weightDraft,editMode,timer,tt,...keep}=this.state; localStorage.setItem('nosfit_v2', JSON.stringify(keep)); }catch(e){} }\n  up(fn){ this.setState(fn, ()=>this.save()); }\n\n  // ---- helpers ----\n  pad(n){ return String(n).padStart(2,'0'); }\n  todayStr(){ const d=new Date(); return d.getFullYear()+'-'+this.pad(d.getMonth()+1)+'-'+this.pad(d.getDate()); }\n  toastMsg(t){ this.setState({toast:t}); if(this.tt) clearTimeout(this.tt); this.tt=setTimeout(()=>this.setState({toast:''}),2200); }\n  fmt(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60; return h>0 ? h+'h '+this.pad(m)+'m' : m+':'+this.pad(sec); }\n\n  defaultWorkouts(){ return {\n    0:{name:'Descanso', exs:null},\n    1:{name:'Peito & Tríceps', exs:[]},\n    2:{name:'Costas & Bíceps', exs:[]},\n    3:{name:'Pernas & Glúteos', exs:[]},\n    4:{name:'Ombros & Core', exs:[]},\n    5:{name:'Push (Full)', exs:[]},\n    6:{name:'Cardio & Mobilidade', exs:[]},\n  }; }\n  dayIcon(k,rest){ return rest?'😴':({0:'🧘',1:'💪',2:'🔙',3:'🦵',4:'🏆',5:'🔥',6:'🏃'})[k]; }\n  dayTint(k,rest){ return rest?'#F0E9F5':({0:'#F0E9F5',1:'#FDE7EC',2:'#E7F0FD',3:'#FDF0E7',4:'#E7FDF3',5:'#FDE7F5',6:'#FDF7E7'})[k]; }\n  updWorkout(dk,obj){ const w=this.state.who; this.up(s=>({workouts:{...s.workouts,[w]:{...s.workouts[w],[dk]:{...s.workouts[w][dk],...obj}}}})); }\n  renameDay(dk){ const w=this.state.who; const n=window.prompt('Nome do treino:',this.state.workouts[w][dk].name); if(n!=null&&n.trim())this.updWorkout(dk,{name:n.trim()}); }\n  addEx(dk){ const el=this.addExRef.current; if(!el||!el.value.trim())return; const t=el.value.trim(); el.value=''; const w=this.state.who; this.up(s=>{ const cur=s.workouts[w][dk]; return {workouts:{...s.workouts,[w]:{...s.workouts[w],[dk]:{...cur,exs:(cur.exs||[]).concat(t)}}}}; }); }\n  editEx(dk,i){ const w=this.state.who; const exs=this.state.workouts[w][dk].exs||[]; const t=window.prompt('Editar exercício (deixar vazio apaga):',exs[i]); if(t==null)return; this.up(s=>{ const arr=[...(s.workouts[w][dk].exs||[])]; if(t.trim())arr[i]=t.trim(); else arr.splice(i,1); return {workouts:{...s.workouts,[w]:{...s.workouts[w],[dk]:{...s.workouts[w][dk],exs:arr}}}}; }); }\n  removeEx(dk,i){ const w=this.state.who; this.up(s=>{ const arr=[...(s.workouts[w][dk].exs||[])]; arr.splice(i,1); return {workouts:{...s.workouts,[w]:{...s.workouts[w],[dk]:{...s.workouts[w][dk],exs:arr}}}}; }); }\n  setRest(dk){ this.updWorkout(dk,{name:'Descanso',exs:null}); }\n  setTraining(dk){ const cur=this.state.workouts[this.state.who][dk]; this.updWorkout(dk,{exs:[],name:cur.name==='Descanso'?'Treino':cur.name}); }\n\n  // ---- pill ----\n  pillInfo(){\n    const now=new Date(this.state.now); const y=now.getFullYear(),mo=now.getMonth(),da=now.getDate();\n    const target=new Date(y,mo,da,21,0,0,0).getTime();\n    const taken=this.state.pill.takenDate===this.todayStr();\n    const C=502.6;\n    if(taken){\n      const tmr=new Date(y,mo,da+1,21,0,0,0).getTime();\n      return {taken:true,color:'#8B5CF6',dashoffset:0,frac:1,big:'Tomada ✓',bigSize:'34px',sub:'Vemo-nos amanhã às 21:00',streak:this.state.pill.streak,notify:false,btnBg:'#C9B8EC',btnLabel:'💜 Já tomaste hoje',ringAnim:'none'};\n    }\n    const rem=target-this.state.now;\n    if(rem<=0){\n      return {taken:false,color:'#C42020',dashoffset:0,frac:1,big:this.fmt(-rem),bigSize:'34px',sub:'atrasada — toma agora! 🚨',streak:this.state.pill.streak,notify:true,bannerText:'A pílula está atrasada! Já passou das 21:00 🚨',btnBg:'#C42020',btnLabel:'💊 Tomar agora',ringAnim:'pulse 1s infinite'};\n    }\n    const h=rem/3600000; let c;\n    if(h>4) c='#34A853'; else if(h>2) c='#8FB63A'; else if(h>1) c='#E0A800'; else if(h>0.25) c='#F0813C'; else c='#E23B3B';\n    const frac=Math.min(1,Math.max(0.02,1-rem/(12*3600000)));\n    const notify=rem<=15*60000;\n    const rm=Math.ceil(rem/60000);\n    return {taken:false,color:c,dashoffset:C*(1-frac),frac,big:this.fmt(rem),bigSize:h>=1?'40px':'46px',sub:notify?'menos de 15 min! 🔔':'até às 21:00',streak:this.state.pill.streak,notify,bannerText:'Faltam '+rm+' min para a pílula da Daddys Girl 💊',btnBg:c,btnLabel:'💊 Já tomei!',ringAnim:notify?'pulse 1s infinite':'none'};\n  }\n  takePill(){ if(this.state.pill.takenDate===this.todayStr()) return; this.up(s=>({pill:{takenDate:this.todayStr(),streak:s.pill.streak+1}})); this.toastMsg('💜 Boa! Streak +1'); }\n  nudge(){ this.toastMsg('🔔 Lembrete enviado à Daddys Girl'); }\n\n  // ---- goals ----\n  goalCfg(who){ const p=this.planResult(who); return who==='daddy'\n    ? {waterGoal:3.0, calGoal:p.target, sleepGoal:8}\n    : {waterGoal:2.5, calGoal:p.target, sleepGoal:8}; }\n  bumpGoal(field,delta){ const w=this.state.who; this.up(s=>{ const g={...s.goals[w]}; if(field==='workout'){g.workout=!g.workout;} else {g[field]=Math.max(0,Math.round((g[field]+delta)*100)/100);} return {goals:{...s.goals,[w]:g}}; }); }\n  goalPct(who){ const g=this.state.goals[who],c=this.goalCfg(who); const parts=[Math.min(1,g.water/c.waterGoal),Math.min(1,g.cal/c.calGoal),Math.min(1,g.sleep/c.sleepGoal),g.workout?1:0]; return Math.round(parts.reduce((a,b)=>a+b,0)/4*100); }\n\n  // ---- plan (Mifflin-St Jeor) ----\n  planResult(who){\n    const p=this.state.plan[who];\n    const bmr=10*p.current+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);\n    const tdee=bmr*p.activity;\n    const target=Math.round((tdee-p.deficit)/10)*10;\n    const protein=Math.round(2*p.current);\n    const fat=Math.round(target*0.25/9);\n    const carbs=Math.max(0,Math.round((target-protein*4-fat*9)/4));\n    const weekly=Math.round(p.deficit*7/7700*100)/100;\n    const toLose=Math.max(0,p.current-p.goal);\n    const weeks=weekly>0?toLose/weekly:0;\n    let eta='—';\n    if(toLose<=0.05) eta='atingida! 🎉';\n    else if(weeks<8) eta='≈ '+Math.round(weeks)+' sem';\n    else { const d=new Date(); d.setDate(d.getDate()+Math.round(weeks*7)); eta=this.pad(d.getDate())+'/'+this.pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2); }\n    return {tdee:Math.round(tdee),target,protein,carbs,fat,weekly:weekly.toFixed(2),deficit:p.deficit,eta};\n  }\n  bumpPlan(field,delta){ const w=this.state.who; this.up(s=>{ const p={...s.plan[w]}; p[field]=Math.round((p[field]+delta)*10)/10; if(field==='age')p[field]=Math.round(p[field]); return {plan:{...s.plan,[w]:p}}; }); }\n  setPlan(field,val){ const w=this.state.who; this.up(s=>({plan:{...s.plan,[w]:{...s.plan[w],[field]:val}}})); }\n\n  // ---- weight ----\n  wtBase(s){ const arr=s.weights[s.who]; return arr.length?arr[arr.length-1].v:s.plan[s.who].current; }\n  wtDraft(){ const s=this.state; return s.weightDraft!=null?s.weightDraft:this.wtBase(s); }\n  wtStep(d){ this.setState(s=>({weightDraft:Math.round(((s.weightDraft!=null?s.weightDraft:this.wtBase(s))+d)*10)/10})); }\n  wtSave(){ const w=this.state.who; const v=this.wtDraft(); const d=new Date(); const label=this.pad(d.getDate())+'/'+this.pad(d.getMonth()+1);\n    this.up(s=>({ weights:{...s.weights,[w]:[...s.weights[w],{d:label,v}]}, plan:{...s.plan,[w]:{...s.plan[w],current:v}}, weightDraft:null }));\n    this.toastMsg('✓ Peso registado: '+v+' kg'); }\n\n  chart(series){\n    const vals=series.map(p=>p.v); const min=Math.min(...vals),max=Math.max(...vals);\n    const pad=(max-min)*0.35||1; const lo=min-pad,hi=max+pad;\n    const W=320,H=130,px=10,py=12;\n    const X=i=>px+i*((W-2*px)/(series.length-1));\n    const Y=v=>py+(1-(v-lo)/(hi-lo))*(H-2*py);\n    const pts=series.map((p,i)=>[X(i),Y(p.v)]);\n    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');\n    const area='M'+pts[0][0].toFixed(1)+' '+(H-py)+' '+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-py)+' Z';\n    const dots=pts.map((p,i)=>({x:p[0].toFixed(1),y:p[1].toFixed(1),r:i===pts.length-1?5:3}));\n    return {line,area,dots};\n  }\n\n  // ---- messages ----\n  sendMsg(){ const el=this.msgRef.current; if(!el||!el.value.trim())return; const txt=el.value.trim(); el.value='';\n    this.up(s=>({messages:[...s.messages,{date:'hoje',from:s.who,text:txt}]}));\n    this.toastMsg('💌 Enviado!'); }\n  onMsgKey(e){ if(e.key==='Enter') this.sendMsg(); }\n\n  renderVals(){\n    const s=this.state, who=s.who, isDaddy=who==='daddy', isGirl=who==='girl';\n    const partner=isDaddy?'girl':'daddy';\n    const meColor=isDaddy?'#8B5CF6':'#E23B3B', meColorSoft=isDaddy?'#B79BF2':'#F0788A';\n    const meColorFaint=isDaddy?'rgba(139,92,246,.10)':'rgba(226,59,59,.10)';\n    const partnerColor=isDaddy?'#E23B3B':'#8B5CF6', partnerColorSoft=isDaddy?'#F0788A':'#B79BF2';\n    const meName=isDaddy?'Daddy':'Daddys Girl';\n    const partnerName=isDaddy?'Daddys Girl':'Daddy';\n    const now=new Date(s.now);\n    const dias=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];\n    const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];\n\n    const pill=this.pillInfo();\n    const bg='linear-gradient(180deg,#FFF3F0,#FCEBEF 60%,#FBE8F0)';\n\n    // goals cards\n    const g=s.goals[who], cfg=this.goalCfg(who);\n    const ring=(f)=>100.5*(1-Math.min(1,f));\n    const goalCards=[\n      {icon:'💧',label:'Água',value:g.water.toFixed(2).replace('.',',')+' / '+cfg.waterGoal.toFixed(1).replace('.',',')+' L',color:'#3BA7D8',dash:ring(g.water/cfg.waterGoal),check:g.water>=cfg.waterGoal?'✓':'',tap:()=>this.bumpGoal('water',0.25)},\n      {icon:'🍽️',label:'Calorias',value:g.cal+' / '+cfg.calGoal,color:'#F0813C',dash:ring(g.cal/cfg.calGoal),check:g.cal>=cfg.calGoal?'✓':'',tap:()=>this.bumpGoal('cal',100)},\n      {icon:'😴',label:'Sono',value:g.sleep.toFixed(1).replace('.',',')+' / '+cfg.sleepGoal+' h',color:'#8B5CF6',dash:ring(g.sleep/cfg.sleepGoal),check:g.sleep>=cfg.sleepGoal?'✓':'',tap:()=>this.bumpGoal('sleep',0.5)},\n      {icon:'🏋️',label:'Treino',value:g.workout?'Feito!':'Por fazer',color:'#34A853',dash:ring(g.workout?1:0),check:g.workout?'✓':'',tap:()=>this.bumpGoal('workout',0)},\n    ];\n\n    // week strip\n    const wmap=s.workouts[who];\n    const isRestToday=wmap[now.getDay()].exs===null;\n    const dow=(now.getDay()+6)%7;\n    const monday=new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);\n    const selIdx=s.selIdx==null?dow:s.selIdx;\n    const week=[]; const dowLbl=['S','T','Q','Q','S','S','D'];\n    for(let i=0;i<7;i++){ const dt=new Date(monday); dt.setDate(monday.getDate()+i); const isSel=i===selIdx; const isToday=i===dow; const wk=wmap[dt.getDay()];\n      week.push({ dow:dowLbl[i], dd:this.pad(dt.getDate()),\n        select:()=>this.setState({selIdx:i}),\n        bg:isSel?meColor:(isToday?'#fff':'rgba(255,255,255,.55)'),\n        sh:isSel?'0 8px 18px -8px '+meColor:'none',\n        dowColor:isSel?'rgba(255,255,255,.8)':'#B78A93',\n        numColor:isSel?'#fff':'#4A3A3F',\n        dot: wk.exs?(isSel?'#fff':meColor):'transparent' });\n    }\n    const selDate=new Date(monday); selDate.setDate(monday.getDate()+selIdx);\n    const dk=selDate.getDay();\n    const selW=wmap[dk];\n    const isRest=selW.exs===null;\n    const hasEx=!isRest;\n    const exs=hasEx?selW.exs.map((name,i)=>{ const done=!!s.exDone[dk+'-'+i]; return {name,tick:done?'✓':'',\n      toggle:()=> s.editMode?this.editEx(dk,i):this.up(st=>({exDone:{...st.exDone,[dk+'-'+i]:!st.exDone[dk+'-'+i]}})),\n      remove:()=>this.removeEx(dk,i),\n      border:done?meColor:'#F1E4E6',bg:done?meColorFaint:'#FCF6F7',mark:done?meColor:'#DCC9CE',fill:done?meColor:'transparent',\n      txt:done?'#9A8A8E':'#4A3A3F',strike:done&&!s.editMode?'line-through':'none'};}):[];\n    const doneCount=exs.filter(e=>e.tick==='✓').length;\n    const selWk={ name:selW.name, icon:this.dayIcon(dk,isRest), tint:this.dayTint(dk,isRest),\n      dayLabel:dias[selDate.getDay()][0].toUpperCase()+dias[selDate.getDay()].slice(1)+' '+this.pad(selDate.getDate())+' '+meses[selDate.getMonth()],\n      hasEx, isRest, editMode:s.editMode, showChecklist:!s.editMode&&hasEx, showRest:!s.editMode&&isRest,\n      empty:hasEx&&exs.length===0, exs, doneCount, total:exs.length,\n      toggleEdit:()=>this.setState(st=>({editMode:!st.editMode})),\n      rename:()=>this.renameDay(dk), addEx:()=>this.addEx(dk), addExKey:(e)=>{ if(e.key==='Enter')this.addEx(dk); }, setRest:()=>this.setRest(dk), setTraining:()=>this.setTraining(dk),\n      editColor: s.editMode?meColor:'#B78A93' };\n    const splitList=[1,2,3,4,5,6,0].map((k,ix)=>({dow:['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][ix],icon:this.dayIcon(k,wmap[k].exs===null),name:wmap[k].name}));\n\n    // weight + chart\n    const series=s.weights[who];\n    const p=s.plan[who];\n    const hasW=series.length>0;\n    const cur=hasW?series[series.length-1].v:p.current;\n    const start=hasW?series[0].v:cur;\n    const totalDelta=cur-start;\n    const progDen=start-p.goal;\n    const progPct=Math.max(0,Math.min(100,progDen!==0?Math.round((start-cur)/progDen*100):0));\n    const hasChart=series.length>=2;\n    const ch=hasChart?this.chart(series):{line:'',area:'',dots:[]};\n    const wt={ current:cur.toFixed(1).replace('.',','), goal:p.goal.toFixed(1).replace('.',','),\n      delta:(totalDelta<=0?'▼ ':'▲ ')+Math.abs(totalDelta).toFixed(1).replace('.',',')+' kg', deltaColor:totalDelta<=0?'#2E9E5B':'#D06',\n      progPct, line:ch.line, area:ch.area, dots:ch.dots, firstDate:hasW?series[0].d:'', draft:this.wtDraft().toFixed(1).replace('.',','),\n      hasW, hasChart, noChart:!hasChart };\n\n    const plan=this.planResult(who);\n\n    const steppers=[\n      {label:'Peso atual',hint:'quilos',value:p.current.toFixed(1).replace('.',',')+' kg',minus:()=>this.bumpPlan('current',-0.5),plus:()=>this.bumpPlan('current',0.5)},\n      {label:'Peso objetivo',hint:'quilos',value:p.goal.toFixed(1).replace('.',',')+' kg',minus:()=>this.bumpPlan('goal',-0.5),plus:()=>this.bumpPlan('goal',0.5)},\n      {label:'Altura',hint:'cm',value:Math.round(p.height)+' cm',minus:()=>this.bumpPlan('height',-1),plus:()=>this.bumpPlan('height',1)},\n      {label:'Idade',hint:'anos',value:Math.round(p.age)+'',minus:()=>this.bumpPlan('age',-1),plus:()=>this.bumpPlan('age',1)},\n    ];\n    const seg=(active,col)=>({border:active?col:'#EAD7DB',bg:active?col:'#fff',fg:active?'#fff':'#9A8A8E'});\n    const actVals=[{v:1.375,label:'Leve'},{v:1.55,label:'Moderado'},{v:1.725,label:'Ativo'}];\n    const activityOpts=actVals.map(a=>{const o=seg(Math.abs(p.activity-a.v)<0.01,meColor);return {label:a.label,pick:()=>this.setPlan('activity',a.v),...o};});\n    const defVals=[{v:300,label:'Suave'},{v:500,label:'Normal'},{v:700,label:'Intenso'}];\n    const deficitOpts=defVals.map(d=>{const o=seg(p.deficit===d.v,meColor);return {label:d.label,pick:()=>this.setPlan('deficit',d.v),...o};});\n    const sm=seg(p.sex==='m',meColor), sf=seg(p.sex==='f',meColor);\n\n    // partner\n    const pp=s.plan[partner], ps=s.weights[partner];\n    const pCur=ps.length?ps[ps.length-1].v:pp.current;\n    const pTotal=ps.length?pCur-ps[0].v:0;\n    const partnerObj={ weight:pCur.toFixed(1).replace('.',','), wDelta:(pTotal<=0?'▼':'▲')+Math.abs(pTotal).toFixed(1).replace('.',','),\n      goalsPct:this.goalPct(partner),\n      stat: partner==='girl'?(pill.taken?'✓':pill.streak):(this.goalPct('daddy')>=100?'✓':'💪'),\n      statLabel: partner==='girl'?(pill.taken?'pílula ok':'streak'):'foco',\n      workout: s.workouts[partner][now.getDay()].name };\n\n    // thread\n    const thread=s.messages.map(m=>{ const mine=m.from===who; const c=m.from==='daddy'?'#8B5CF6':'#E23B3B'; return {\n      text:m.text, date:m.date, name:m.from==='daddy'?'Daddy 💜':'Daddys Girl ❤️',\n      align:mine?'flex-end':'flex-start', bubble:mine?c:'#fff', fg:mine?'#fff':'#4A3A3F',\n      nameColor:mine?'rgba(255,255,255,.75)':c, radius:mine?'20px 20px 6px 20px':'20px 20px 20px 6px' }; });\n\n    const tabDef=[['inicio','🏠','Início'],['treino','🏋️','Treino'],['prog','📈','Progresso'],['nos','💌','Nós']];\n    const tabs=tabDef.map(([k,icon,label])=>{ const act=s.tab===k; return {icon,label,go:()=>this.setState({tab:k}),\n      bg:act?(isDaddy?'rgba(139,92,246,.15)':'rgba(226,59,59,.13)'):'transparent', color:act?meColor:'#B7A2A8' }; });\n\n    const clock=this.pad(now.getHours())+':'+this.pad(now.getMinutes());\n    const threadEmpty=thread.length===0;\n    const latest=s.messages.length?s.messages[s.messages.length-1]:null;\n\n    return {\n      bg, clock, who, isDaddy, isGirl, meColor, meColorSoft, meColorFaint, meName,\n      isInicio:s.tab==='inicio', isTreino:s.tab==='treino', isProg:s.tab==='prog', isNos:s.tab==='nos',\n      dateLong: dias[now.getDay()][0].toUpperCase()+dias[now.getDay()].slice(1)+', '+now.getDate()+' '+meses[now.getMonth()],\n      greeting: isDaddy?'Olá, Daddy 💜':'Olá, Daddys Girl ❤️',\n      pill, ringAnim:pill.ringAnim, takePill:()=>this.takePill(), nudge:()=>this.nudge(),\n      goalCards, goalsDonePct:this.goalPct(who),\n      todayWorkout: wmap[now.getDay()].name,\n      latestMsg: latest?latest.text:'Ainda sem recadinhos — escreve o primeiro 💌',\n      latestMsgFrom: latest?('— '+(latest.from==='daddy'?'Daddy':'Daddys Girl')):'',\n      latestMsgColor: latest&&latest.from==='daddy'?'#8B5CF6':'#E23B3B',\n      goTreino:()=>this.setState({tab:'treino'}), goNos:()=>this.setState({tab:'nos'}),\n      week, selWk, splitList,\n      wt, plan, steppers, activityOpts, deficitOpts,\n      wtMinus:()=>this.wtStep(-0.1), wtPlus:()=>this.wtStep(0.1), wtSave:()=>this.wtSave(),\n      setMale:()=>this.setPlan('sex','m'), setFemale:()=>this.setPlan('sex','f'),\n      sexMBorder:sm.border,sexMBg:sm.bg,sexMFg:sm.fg,sexFBorder:sf.border,sexFBg:sf.bg,sexFFg:sf.fg,\n      partnerColor, partnerColorSoft, partnerName, partnerEmoji:isDaddy?'👧':'🧔', partner:partnerObj,\n      thread, threadEmpty, addExRef:this.addExRef, msgRef:this.msgRef, sendMsg:()=>this.sendMsg(), onMsgKey:(e)=>this.onMsgKey(e),\n      loginOpen:!s.loggedIn, loginDaddy:()=>this.up(st=>({loggedIn:true,who:'daddy'})), loginGirl:()=>this.up(st=>({loggedIn:true,who:'girl'})), logout:()=>this.up(st=>({loggedIn:false})),\n      isRestToday, notifEnabled:s.notif.enabled, enableReminders:()=>this.enableReminders(),\n      notifBtnLabel:s.notif.enabled?'Ativos ✓':'Ativar',\n      notifBtnBg:s.notif.enabled?meColor:'#fff', notifBtnFg:s.notif.enabled?'#fff':meColor,\n      composePlaceholder: isDaddy?'Escreve algo fofo para ela…':'Escreve algo fofo para ele…',\n      tabs,\n      pickDaddy:()=>this.setState({who:'daddy',weightDraft:null}), pickGirl:()=>this.setState({who:'girl',weightDraft:null}),\n      daddyTabBg:isDaddy?'#8B5CF6':'#fff', daddyTabFg:isDaddy?'#fff':'#9A8A8E', daddyTabSh:isDaddy?'0 8px 18px -8px #8B5CF6':'0 2px 8px -6px rgba(0,0,0,.2)',\n      girlTabBg:isGirl?'#E23B3B':'#fff', girlTabFg:isGirl?'#fff':'#9A8A8E', girlTabSh:isGirl?'0 8px 18px -8px #E23B3B':'0 2px 8px -6px rgba(0,0,0,.2)',\n      toast:s.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
